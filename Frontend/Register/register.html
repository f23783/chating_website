<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REQ'S REGISTER SCREEN</title>
    <link rel="stylesheet" href="register_styles.css">
</head>
<body>
    <div class="register_container" id="register_container">
        <div class="register_navbar" id="register_navbar">
            <div class="web_logo">
                <a href="#"></a>
            </div>
        </div>

        <div class="description_texts">
                    <h1>Welcome to "CHATING"</h1>
                    <h2>SIGN UP</h2>
        </div>

       <div class="requirement_texts">
                    <h3>First Name</h3>
                    <input type="text" id="first_name" placeholder="Enter your first name">
                    <h3>Last Name</h3>
                    <input type="text" id="last_name" placeholder="Enter your last name">
                    <h3>Phone Number</h3>
                    <input type="text" id="phone_number" placeholder="Enter valid phone number">
                    <h3>Username</h3>
                    <input type="text" id="username" placeholder="Write an username">
                    <h3>Password</h3>
                    <input type="password" id="password" placeholder="Create password">
       </div>

        <div class="buttons">
                    <button id="button_signup" >Sign Up</button>
        </div>      

        <div class="have_account">
                    <a href=http://127.0.0.1:5500/Login/index.html>Already have an account?</a>
        </div>

    </div>
</body>
</html>
