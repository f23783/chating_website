<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REQ'S HOME SCREEN</title>
    <link rel="stylesheet" href="home_styles.css">
</head>
<body>


    <nav class="home_navbar">
        <div style="display: flex; align-items: center;">

            <div class="web_logo">
                <a href="http://127.0.0.1:5500/Home/home.html#"></a>
            </div>

            <h1>CHATING WEBSITE</h1>
            
        </div>

        <ul>
            <li><a href="#">Search</a></li>
            <li><a href="#">Add Friend</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>


    <aside class="sidebar">
        <h3>Search</h3>
        <input type="text" id="searching" placeholder="Search or create new chat">
        <h3>Chats</h3>
        <div class="chat_item">Ubuntu</div>
        <div class="chat_item">Ubuntu2</div>
        <div class="chat_item">Ubuntu3</div>
        <div class="chat_item">Ubuntu4</div>
        <div class="chat_item">Ubuntu5</div>
        <div class="chat_item">Ubuntu6</div>
 
    </aside>


    <main class="home_container">
        <div class="chat_navbar">Ubuntu</div>

        <div class="chat_content">

            <div class="message message_received">
                <div class="message_text">Hello!</div>
                <div class="message_time">20:31</div>
            </div>

            <div class="message message_received">
                <div class="message_text">Are you here?</div>
                <div class="message_time">20:32</div>
            </div>

            <div class="message message_sent">
                <div class="message_text">Who the hell are you?</div>
                <div class="message_time">20:42</div>
            </div>

            <div class="message message_received">
                <div class="message_text">I am your unknown sister..</div>
                <div class="message_time">20:43</div>
            </div>

            <div class="message message_sent">
                <div class="message_text">WHATT!!?</div>
                <div class="message_time">20:43</div>
            </div>
            
        </div>
        <div class="typing_bar">
            <input type="text" id="typing_bar" placeholder="Enter your message">
        </div>

    </main>



</body>
</html>
